name: Motion request
description: Suggest an animal motion without uploading private media.
body:
  - type: input
    id: animal
    attributes:
      label: Animal and motion
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Public source and licence
      description: Optional link to openly licensed media. Do not upload private clips.
