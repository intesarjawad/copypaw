name: motions
on:
  pull_request:
    paths:
      - "motions/**"
      - "scripts/build_motions.py"
      - "scripts/check_commons_licences.py"
      - ".github/workflows/motions.yml"
permissions: { contents: read }
env:
  UV_PYTHON: "3.12"
jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - run: uv python install 3.12 && uv sync --all-groups --locked
      - run: uv run python scripts/check_commons_licences.py
      - run: uv run pytest tests/unit/test_gallery.py --no-cov
  motions-capture:
    needs: licences
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - run: uv python install 3.12 && uv sync --all-groups --locked
      - run: uv run python scripts/build_motions.py --new
      - run: uv run pytest tests/unit/test_gallery.py --no-cov --motions-extra motions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motions
          path: motions
  motions-sheet:
    needs: motions-capture
    runs-on: ubuntu-latest
    env:
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6 libosmesa6-dev libglu1-mesa
      - run: uv python install 3.12 && uv sync --all-groups --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: motions
          path: motions
      - name: Check the sheet inputs
        id: inputs
        run: |
          if compgen -G "motions/*/motion.npz" > /dev/null &&
             [ -f samples/drawings/dragon.png ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No gallery motion and dragon sample yet; skipping the sheets."
          fi
      - if: steps.inputs.outputs.ready == 'true'
        run: uv run copypaw rig samples/drawings/dragon.png --out "$RUNNER_TEMP/dragon"
      - if: steps.inputs.outputs.ready == 'true'
        run: >-
          uv run python scripts/bench.py --contact-sheet
          --drawing "$RUNNER_TEMP/dragon" --review "$RUNNER_TEMP/review"
      - if: steps.inputs.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contact-sheets
          path: ${{ runner.temp }}/review
