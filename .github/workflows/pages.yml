name: pages
# Clips are rendered here and published, never committed: a push made with the
# default GITHUB_TOKEN triggers no workflow, so a commit-then-deploy chain would
# never deploy. A human merge to main does trigger this run.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "motions/**"
      - "docs/site/**"
      - "web/**"
      - "copypaw/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: pages
  cancel-in-progress: false
env:
  UV_PYTHON: "3.12"
jobs:
  motions-capture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - run: uv python install 3.12 && uv sync --all-groups --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/copypaw/models
          key: models-accurate-${{ hashFiles('copypaw/models.py') }}
      - run: uv run python scripts/build_motions.py --new
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motions-new
          path: motions
  build:
    needs: motions-capture
    runs-on: ubuntu-latest
    env:
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7" }
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6 libosmesa6-dev libglu1-mesa
      - run: uv python install 3.12 && uv sync --all-groups --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: motions-new
          path: motions
      - name: Check the gallery inputs
        id: inputs
        run: |
          if compgen -G "motions/*/motion.npz" > /dev/null &&
             compgen -G "samples/drawings/*/char_cfg.yaml" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No gallery motion and drawing yet; skipping the clips."
          fi
      - if: steps.inputs.outputs.ready == 'true'
        run: uv run python scripts/build_gallery.py
      - if: steps.inputs.outputs.ready == 'true'
        run: uv run python scripts/build_gallery.py --check-budget
      - run: uv run pytest tests/unit/test_assets_clean.py --no-cov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # The site is served from the root of its own domain; a fork without one is served under its repository path.
      - name: Build the light table
        working-directory: web
        run: npm ci && npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - name: Lighthouse accessibility
        run: |
          mkdir -p "$RUNNER_TEMP/pages${{ steps.pages.outputs.base_path }}"
          cp -R copypaw/app/static/. "$RUNNER_TEMP/pages${{ steps.pages.outputs.base_path }}/"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages" &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 2
          for preset in mobile desktop; do
            extra=()
            if [ "$preset" = desktop ]; then extra=(--preset=desktop); fi
            npx --yes lighthouse@13.6.0 http://127.0.0.1:8080${{ steps.pages.outputs.base_path }}/ "${extra[@]}" \
              --only-categories=accessibility --output=json \
              --output-path="$RUNNER_TEMP/lighthouse-$preset.json" --quiet \
              --chrome-flags="--headless=new --enable-unsafe-swiftshader"
            uv run python -c "import json, sys; score = json.load(open(sys.argv[1]))['categories']['accessibility']['score']; print(sys.argv[1], score); sys.exit(0 if score == 1 else 1)" "$RUNNER_TEMP/lighthouse-$preset.json"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: copypaw/app/static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
